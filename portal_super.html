<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Proveedores - HEB Supermercados</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h1 class="text-2xl font-bold text-red-600">Portal de Resurtido B2B (Supermercado)</h1>
            <span class="bg-red-100 text-red-800 text-sm font-semibold px-3 py-1 rounded">Sesión Activa</span>
        </div>

        <form id="orderForm" class="space-y-6">
            <div>
                <label for="user_id" class="block text-sm font-medium text-gray-700">ID de Usuario Comprador</label>
                <input type="text" id="user_id" name="user_id" placeholder="Ej. USR-9982" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label for="product" class="block text-sm font-medium text-gray-700">Producto a Resurtir</label>
                    <input type="text" id="product" name="product" placeholder="Nombre del producto" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                </div>
                <div>
                    <label for="qty" class="block text-sm font-medium text-gray-700">Cantidad (Piezas)</label>
                    <input type="number" id="qty" name="qty" placeholder="0" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                </div>
            </div>

            <button type="button" onclick="triggerStopper()" class="w-full bg-red-600 text-white font-bold py-3 px-4 rounded hover:bg-red-700 transition">
                Procesar Orden de Compra
            </button>
        </form>
    </div>

    <div id="stopperModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex justify-center items-center">
        <div class="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
            <h2 class="text-xl font-bold text-yellow-600 mb-4">⚠️ ¡Aviso Importante!</h2>
            <p class="text-gray-700 mb-6">Se ha detectado un cambio en la política de envíos. Debes confirmar antes de proceder.</p>
            <div class="flex justify-between space-x-4">
                <button onclick="closeStopper()" class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400">Cancelar</button>
                <button onclick="closeStopper()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Aceptar y Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // Función que activa la "trampa"
        function triggerStopper() {
            document.getElementById('stopperModal').classList.remove('hidden');
        }

        function closeStopper() {
            document.getElementById('stopperModal').classList.add('hidden');
            alert("Orden enviada exitosamente al sistema destino.");
        }
    </script>
</body>
</html>
